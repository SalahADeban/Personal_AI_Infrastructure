# Docker Compose for Home Server (10.0.20.10)
# ============================================================================
#
# Services:
#   - Home Assistant (IoT hub)
#   - Plex (media server)
#   - Nextcloud (file sync)
#   - Pi-hole (DNS/ad blocking)
#
# Usage:
#   docker compose up -d
#
# ============================================================================

services:
  # ==========================================================================
  # Home Assistant - IoT Hub
  # Accessible from IoT VLAN on port 8123
  # ==========================================================================
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    privileged: true
    network_mode: host  # Required for device discovery
    volumes:
      - ./homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/Los_Angeles  # Change to your timezone

  # ==========================================================================
  # Plex Media Server
  # ==========================================================================
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    network_mode: host  # Required for DLNA/casting
    volumes:
      - ./plex/config:/config
      - /path/to/movies:/movies      # Change path
      - /path/to/tv:/tv              # Change path
      - /path/to/music:/music        # Change path
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - VERSION=docker
      # Claim token from https://plex.tv/claim
      # - PLEX_CLAIM=claim-xxxxx

  # ==========================================================================
  # Jellyfin (Alternative to Plex - Open Source)
  # ==========================================================================
  # jellyfin:
  #   image: jellyfin/jellyfin:latest
  #   container_name: jellyfin
  #   restart: unless-stopped
  #   network_mode: host
  #   volumes:
  #     - ./jellyfin/config:/config
  #     - ./jellyfin/cache:/cache
  #     - /path/to/media:/media:ro
  #   environment:
  #     - JELLYFIN_PublishedServerUrl=http://10.0.20.10

  # ==========================================================================
  # Nextcloud - File Sync
  # ==========================================================================
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nextcloud/data:/var/www/html
    environment:
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=CHANGE_THIS_PASSWORD
      - NEXTCLOUD_TRUSTED_DOMAINS=10.0.20.10 nextcloud.local
    depends_on:
      - nextcloud-db

  nextcloud-db:
    image: mariadb:10.11
    container_name: nextcloud-db
    restart: unless-stopped
    volumes:
      - ./nextcloud/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=CHANGE_ROOT_PASSWORD
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=CHANGE_THIS_PASSWORD
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW

  # ==========================================================================
  # Pi-hole - DNS & Ad Blocking
  # Set OpenWrt DHCP to push this as DNS server
  # ==========================================================================
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"  # Web interface (http://10.0.20.10:8081/admin)
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    environment:
      - TZ=America/Los_Angeles
      - WEBPASSWORD=CHANGE_THIS_PASSWORD
      - PIHOLE_DNS_=1.1.1.1;8.8.8.8
      - DNSSEC=true
      - DNSMASQ_LISTENING=all
    cap_add:
      - NET_ADMIN

  # ==========================================================================
  # Portainer - Docker Management UI
  # ==========================================================================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer/data:/data

  # ==========================================================================
  # Watchtower - Auto-update containers
  # ==========================================================================
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *  # 4 AM daily
      - WATCHTOWER_NOTIFICATIONS=email  # Optional
      # - WATCHTOWER_NOTIFICATION_EMAIL_FROM=
      # - WATCHTOWER_NOTIFICATION_EMAIL_TO=
      # - WATCHTOWER_NOTIFICATION_EMAIL_SERVER=
      # - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_USER=
      # - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PASSWORD=

# =============================================================================
# Networks
# Using host networking for most services for device discovery
# =============================================================================

# Optional: Create custom network for services that don't need host networking
# networks:
#   homelab:
#     driver: bridge
#     ipam:
#       config:
#         - subnet: 172.20.0.0/16
